<script>
window.onerror=(m,u,l)=>{const d=document.createElement("div");d.style.cssText="position:fixed;left:0;right:0;top:0;background:#600;color:#fff;font:13px sans-serif;padding:6px;z-index:9";d.textContent="JS error: "+m+" (line "+l+")";document.body.appendChild(d)};

const VOW=["অ","আ","ই","ঈ","উ","ঊ","ঋ","এ","ঐ","ও","ঔ","ৎ","ঃ","ং","ঁ","ক্ষ","জ্ঞ","৳"];
const EN="the be to of and a in that have I it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us is are was were been has had did said very hello thanks please yes okay love home friend today tomorrow morning night where here sorry welcome message call send number little".split(" ");
const BNW="আমি তুমি আপনি ধন্যবাদ কেমন আছো আছি ভালো বাংলা হ্যাঁ না কি এই সে আজ কাল আর এবং কোথায় কখন কেন কী করছো খাবে যাবো আসবো বাড়ি স্কুল কাজ সময় ঠিক শুভ সকাল রাত্রি সালাম".split(" ");
const LANGS=["en","bn","ph"];
const VW=[["rri","ঋ","ৃ"],["oi","ঐ","ৈ"],["ou","ঔ","ৌ"],["ii","ঈ","ী"],["uu","ঊ","ূ"],["aa","আ","া"],["OI","ঐ","ৈ"],["OU","ঔ","ৌ"],["a","আ","া"],["i","ই","ি"],["I","ঈ","ী"],["u","উ","ু"],["U","ঊ","ূ"],["e","এ","ে"],["E","এ","ে"],["O","ও","ো"],["o","অ",""]];
const CS=[["kkh","ক্ষ"],["GG","জ্ঞ"],["NG","ঙ"],["ng","ং"],["Rh","ঢ়"],["Th","ঠ"],["Dh","ঢ"],["kh","খ"],["gh","ঘ"],["ch","ছ"],["jh","ঝ"],["ph","ফ"],["bh","ভ"],["sh","শ"],["Sh","ষ"],["th","থ"],["dh","ধ"],["k","ক"],["g","গ"],["c","চ"],["j","জ"],["T","ট"],["D","ড"],["N","ণ"],["t","ত"],["d","দ"],["n","ন"],["p","প"],["f","ফ"],["b","ব"],["v","ভ"],["m","ম"],["z","য"],["Z","য"],["y","য়"],["r","র"],["l","ল"],["s","স"],["S","শ"],["h","হ"],["R","ড়"],["x","ক্স"],["q","ক"],["w","ও"],["^","ঁ"]];
const TK=[...VW.map(([k,a,b])=>({k,v:1,a,b})),...CS.map(([k,a])=>({k,v:0,a}))].sort((p,q)=>q.k.length-p.k.length);
function toBn(r,ok){
  let o="",pc=false,i=0;
  while(i<r.length){
    const t=TK.find(t=>r.startsWith(t.k,i));
    if(!t){o+=r[i];pc=false;i++;continue}
    i+=t.k.length;
    if(t.v){o+=pc?((t.k==="o"&&ok)?"ো":t.b):t.a;pc=false}
    else if(t.a==="ং"||t.a==="ঁ"){o+=t.a;pc=false}
    else if(t.k==="w"){if(pc){o+="্ব";pc=true}else{o+="ও";pc=false}}
    else if(t.k==="y"&&pc){o+="্য";pc=true}
    else{if(pc)o+="্";o+=t.a;pc=true}
  }
  return o;
}
const DICT={ami:"আমি",tumi:"তুমি",apni:"আপনি",se:"সে",amra:"আমরা",tomra:"তোমরা",tara:"তারা",ki:"কি",kemon:"কেমন",acho:"আছো",achi:"আছি",achen:"আছেন",ache:"আছে",bhalo:"ভালো",valo:"ভালো",kharap:"খারাপ",dhonnobad:"ধন্যবাদ",dhonyobad:"ধন্যবাদ",bangla:"বাংলা",bangladesh:"বাংলাদেশ",ekhon:"এখন",kothay:"কোথায়",keno:"কেন",kokhon:"কখন",bhalobashi:"ভালোবাসি",valobashi:"ভালোবাসি",hya:"হ্যাঁ",na:"না",naki:"নাকি",tomake:"তোমাকে",amake:"আমাকে",tomar:"তোমার",amar:"আমার",apnar:"আপনার",shubho:"শুভ",shuvo:"শুভ",sokal:"সকাল",rat:"রাত",bari:"বাড়ি",kaj:"কাজ",nai:"নাই",hobe:"হবে",jabo:"যাবো",asbo:"আসবো",khabo:"খাবো",bondhu:"বন্ধু",ma:"মা",baba:"বাবা",bhai:"ভাই",bon:"বোন",salam:"সালাম",kintu:"কিন্তু",ebong:"এবং",ar:"আর",tai:"তাই",jodi:"যদি",tahole:"তাহলে",onek:"অনেক",khub:"খুব",aj:"আজ",kal:"কাল",ekta:"একটা",ekti:"একটি",dui:"দুই",tin:"তিন",kothaye:"কোথায়",ghum:"ঘুম",khushi:"খুশি",dekha:"দেখা",hobe:"হবে",bolo:"বলো",bolchi:"বলছি",korbo:"করবো",korchi:"করছি"};
function phCands(r){
  const o=[],d=DICT[r.toLowerCase()];
  if(d)o.push(d);
  [toBn(r,false),toBn(r,true),r].forEach(x=>{if(x&&!o.includes(x))o.push(x)});
  return o;
}
function phUpdate(){cands=phCands(roman);comp=cands[0]||"";if(IME)Android.setComposing(comp);render()}
function phCommit(w,tail){
  if(IME)Android.commit(w+tail);
  text+=w+tail;if(IME)text=text.slice(-150);
  learn(w);roman="";comp="";cands=[];render();
}
function resetComp(){roman="";comp="";cands=[];render()}
function phKey(k){
  if(lang!=="ph")return false;
  const isL=k.length===1&&/[A-Za-z]/.test(k);
  if(!roman){
    if(!isL)return false;
    roman=k;if(shift&&!caps){shift=false;drawKeys()}phUpdate();return true;
  }
  if(isL){roman+=k;if(shift&&!caps){shift=false;drawKeys()}phUpdate();return true}
  if(k==="@bksp"){roman=roman.slice(0,-1);if(roman)phUpdate();else{comp="";cands=[];if(IME)Android.commit("");render()}return true}
  if(k==="@space"){phCommit(cands[0]," ");return true}
  if(k==="@enter"){phCommit(cands[0],"");if(IME)Android.enter();text+="\n";render();return true}
  if(k==="@shift")return false;
  if(k==="@sym"||k==="@lang"){phCommit(cands[0],"");return false}

}
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let learned={};try{learned=JSON.parse(load("lk_words")||"{}")}catch(e){}
let sound=load("lk_sound")!=="0", gi=parseFloat(load("lk_gi"))||1, gli=parseInt(load("lk_gl"))||0, pt;
const GL=["warm","cool","rose"], FR=/[A-Za-z\u0980-\u09FF]+$/;
function applyFx(){const r=document.documentElement;r.dataset.glow=GL[gli];r.style.setProperty("--gi",gi);$("tSound").classList.toggle("off",!sound)}
function learn(w){if(w.length<2)return;if(/^[A-Za-z]+$/.test(w))w=w.toLowerCase();learned[w]=(learned[w]||0)+1;save("lk_words",JSON.stringify(learned))}
function curFrag(){const m=text.match(FR);return m?m[0]:""}
function suggest(){
  if(lang==="ph"&&roman){document.querySelectorAll(".sug").forEach((b,i)=>{const w=cands[i]||"";b.textContent=w;b.style.visibility=w?"visible":"hidden";b.style.fontWeight=i===0?"700":"500"});return}

  for(const w of pool){if(list.length>=3)break;
    if(!list.includes(w)&&(!f||(w.toLowerCase().startsWith(fl)&&w.toLowerCase()!==fl)))list.push(w)}
  document.querySelectorAll(".sug").forEach((b,i)=>{const w=list[i]||"";b.textContent=cap&&w?w[0].toUpperCase()+w.slice(1):w;b.style.visibility=w?"visible":"hidden"});
}
function pick(w){
  if(!w)return; tick();
  if(lang==="ph"&&roman){phCommit(w," ");return}
  const f=curFrag();
  if(IME){for(let i=0;i<f.length;i++)Android.backspace();Android.commit(w+" ")}

  if(IME)text=text.slice(-150);

let roman="",comp="",cands=[],lang="en",text="", shift=false, caps=false, sym=false, bn=false, lastShift=0, audio;
const $=id=>document.getElementById(id);
const kb=$("kb"), paper=$("paper"), lamp=$("lamp"), t1=$("t1"), t2=$("t2");

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
let curX=null,tgtX=0;

let first=true;
function add(s){
  if(IME&&first){text="";first=false}

let dirty=false,repT,repI;

  else if(k==="@shift"){const n=Date.now();if(n-lastShift<350){caps=true;shift=true}else{caps=false;shift=!shift}lastShift=n;dirty=true}
  else if(k==="@sym"){sym=!sym;dirty=true}
  else if(k==="@lang"){lang=LANGS[(LANGS.indexOf(lang)+1)%3];bn=lang==="bn";sym=false;dirty=true}
  else{add(k);if(shift&&!caps){shift=false;dirty=true}}
  render();
  if(dirty){dirty=false;drawKeys()}
}
function out(ch){
  const up=shift||caps;
  if(bn)return up?BS[ch]:BN[ch];
  return up?ch.toUpperCase():ch;
}
function drawKeys(){
  kb.innerHTML="";
  if(bn&&!sym){
    const v=document.createElement("div");v.className="row vow";
    VOW.forEach(c=>v.appendChild(mk(c,c,"")));
    kb.appendChild(v);
  }
  (sym?SYM:ROWS).forEach((r,i)=>{
    const d=document.createElement("div");d.className="row";
    if(i===2&&!sym)d.appendChild(mk("⇧","@shift","wide fn"+(shift||caps?" on":"")));
    r.forEach(ch=>{const o=sym?ch:out(ch);d.appendChild(mk(o,o,""))});
    if(i===2)d.appendChild(mk("⌫","@bksp","wide fn"));
    kb.appendChild(d);
  });
  const b=document.createElement("div");b.className="row";
  b.appendChild(mk(sym?"ABC":"123","@sym","wide fn"));
  b.appendChild(mk(lang==="en"?"EN":lang==="bn"?"বিজয়":"ফোনেটিক","@lang","wide fn"));
  b.appendChild(mk(lang!=="en"?"স্পেস":"space","@space","space"));
  b.appendChild(mk("↵","@enter","wide fn"));
  kb.appendChild(b);
  if(IME)setTimeout(reportSize,30);
}
function reportSize(){if(IME)Android.resize(Math.ceil($("kb").getBoundingClientRect().bottom)+2)}
function mk(label,k,cls){
  const e=document.createElement("button");e.className="key "+cls;e.textContent=label;e.dataset.k=k;e.type="button";
  e.addEventListener("pointerdown",ev=>{ev.preventDefault();press(k);
    if(k==="@bksp"){stopRep();repT=setTimeout(()=>{repI=setInterval(()=>press("@bksp"),60)},400)}});
  return e;
}
function flash(k){[...kb.querySelectorAll(".key")].some(el=>{if(el.dataset.k===k){el.classList.add("down");setTimeout(()=>el.classList.remove("down"),90);return true}})}
/* কম্পিউটারের কীবোর্ড */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  let k=null;
  if(e.key==="Backspace")k="@bksp";else if(e.key==="Enter")k="@enter";else if(e.key===" ")k="@space";
  else if(e.key.length===1){
    const l=e.key.toLowerCase();
    k=(bn&&BN[l])?(e.shiftKey?BS[l]:BN[l]):e.key;
  }
  if(k){e.preventDefault();const s=shift;press(k);flash(k)}
});
document.querySelectorAll(".sug").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();pick(b.textContent)}));
const tap=(id,fn)=>$(id).addEventListener("pointerdown",e=>{e.preventDefault();fn();applyFx()});
tap("tSound",()=>{sound=!sound;save("lk_sound",sound?"1":"0")});
tap("tGlow",()=>{gli=(gli+1)%GL.length;save("lk_gl",gli)});
tap("tBri",()=>{gi=gi>=1.4?0.6:gi+0.4;gi=Math.round(gi*10)/10;save("lk_gi",gi)});
applyFx();
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(text);$("copy").textContent="কপি হয়েছে"}catch(e){$("copy").textContent="কপি হয়নি"}setTimeout(()=>$("copy").textContent="কপি",1500)};
$("share").onclick=async()=>{try{if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text)}catch(e){}};
document.querySelectorAll("[data-send]").forEach(b=>b.onclick=()=>{
  const q=encodeURIComponent(text),t=b.dataset.send;
  const u={wa:"https://wa.me/?text="+q,tg:"https://t.me/share/url?url=%20&text="+q,sms:"sms:?&body="+q,mail:"mailto:?body="+q}[t];
  window.open(u,"_blank")||(location.href=u);
});
$("save").onclick=()=>{const a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(text);a.download="note.txt";a.click()};
$("clear").onclick=()=>{text="";render()};
$("glow").onclick=()=>{gli=(gli+1)%GL.length;save("lk_gl",gli);applyFx()};
window.addEventListener("resize",render);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);

if(!IME){try{text=localStorage.getItem("lk_text")||""}catch(e){}if(!text)text="আমার সোনার বাংলা, আমি তোমায় ভালোবাসি। "}
render();drawKeys();requestAnimationFrame(frame);
</script>
</body>
</html>
