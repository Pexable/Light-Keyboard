name: Build Light Keyboard APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/example/lightkeyboard app/src/main/res/xml app/src/main/res/values app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LightKeyboard"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.lightkeyboard"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.lightkeyboard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Light Keyboard"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LightKeyboardService"
                      android:label="Light Keyboard"
                      android:exported="true"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF

          cat > app/src/main/java/com/example/lightkeyboard/MainActivity.kt <<'EOF'
          package com.example.lightkeyboard

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                  finish()
              }
          }
          EOF

          cp LightKeyboardService.kt app/src/main/java/com/example/lightkeyboard/LightKeyboardService.kt
          cp index.html app/src/main/assets/index.html

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LightKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
